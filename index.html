const LEGACY_KEY='neonCaseArena_v2';

function arr(x){ return Array.isArray(x)?x:[]; }
function validInst(i){ return !!i && typeof i.uid==='string' && !!ITEMS[i.id] && !!WEARS[i.w]; }
function validLot(l){ return !!l && typeof l.lid==='string' && !!ITEMS[l.id] && !!WEARS[l.w] && Number(l.price)>0; }
function loadState(){
  const d=defState();
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return d;
    const s=JSON.parse(raw)||{};
    return {
      coins:(Number(s.coins)||0)+(s.bonus30k?0:30000),
      bonus30k:true,
      sound:s.sound!==false,
      inv:arr(s.inv).filter(validInst),
      mk:{
        mine:arr(s.mk&&s.mk.mine).filter(validLot).map(l=>Object.assign({sellAt:Date.now()+30000},l)),
        bots:arr(s.mk&&s.mk.bots).filter(validLot)

      claimed:s.claimed||{},
      daily:Object.assign({last:'',streak:0},s.daily||{}),
      wheelAt:Number(s.wheelAt)||0
    };
  }catch(e){ return d; }
}

function fmtTime(ms){
  if(ms<0) ms=0;
  const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60;
  const p=n=>String(n).padStart(2,'0');
  return p(h)+':'+p(m)+':'+p(x);
}
function pickW(ws){
  const t=ws.reduce((a,b)=>a+b,0);
  let r=Math.random()*t;
  for(let i=0;i<ws.length;i++){ r-=ws[i]; if(r<0) return i; }
  return ws.length-1;
}
function rollRar(min){ const m=min||0; return m+pickW(RARS.slice(m).map(r=>r.o)); }
function rollItem(cid){ return cid+rollRar(0); }
function makeInst(id,w){ return {uid:uid(),id:id,w:w===undefined?pickW(WEARS.map(x=>x.w)):w}; }

let AC=null;
function audio(){
  try{
    if(!AC){
      const C=window.AudioContext||window.webkitAudioContext;
      if(!C) return null;
      AC=new C();
    }
    if(AC.state==='suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function tone(f,d,type,v,delay){
  if(!S.sound) return;
  const ac=audio(); if(!ac) return;
  try{
    const t=ac.currentTime+(delay||0);
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(v||0.1,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t+d+0.05);
  }catch(e){}
}
const SFX={

  win:()=>{ [523,659,784].forEach((f,i)=>tone(f,0.2,'triangle',0.13,i*0.09)); },

  legend:()=>{ [523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,0.3,'sawtooth',0.08,i*0.085)); },
  myth:()=>{ tone(90,0.8,'sawtooth',0.3); [392,523,659,784,1046].forEach((f,i)=>tone(f,0.35,'square',0.07,0.15+i*0.1)); },
  fail:()=>{ tone(320,0.25,'sawtooth',0.1); tone(220,0.4,'sawtooth',0.1,0.2); }
};
function sfx(n){ if(SFX[n]) SFX[n](); }

/* ===================== ЭФФЕКТЫ ===================== */
function burst(n,color){
  const cx=innerWidth/2, cy=innerHeight*0.4;
  for(let i=0;i<n;i++){
    const p=document.createElement('div');
    p.className='part';
    p.style.background=color; p.style.boxShadow='0 0 10px '+color;
    p.style.left=cx+'px'; p.style.top=cy+'px';
    document.body.appendChild(p);
    const a=Math.random()*Math.PI*2, d=60+Math.random()*180;
    if(p.animate){
      const an=p.animate([
        {transform:'translate(0px,0px) scale(1)',opacity:1},
        {transform:'translate('+(Math.cos(a)*d).toFixed(1)+'px,'+(Math.sin(a)*d).toFixed(1)+'px) scale(.2)',opacity:0}
      ],{duration:900+Math.random()*700,easing:'ease-out',fill:'forwards'});
      an.onfinish=()=>p.remove();
    } else setTimeout(()=>p.remove(),900);
  }
}
function flash(c){
  const el=document.createElement('div');
  el.className='flash';
  el.style.background='radial-gradient(circle,'+c+',transparent 70%)';
  document.body.appendChild(el);
  if(el.animate){
    const an=el.animate([{opacity:0},{opacity:1,offset:.25},{opacity:0}],{duration:900});
    an.onfinish=()=>el.remove();
  } else setTimeout(()=>el.remove(),900);
}
function banner(t,c){
  const el=document.createElement('div');
  el.className='fx-banner'; el.style.color=c; el.textContent=t;
  document.body.appendChild(el);
  if(el.animate){
    const an=el.animate([
      {transform:'scale(.3)',opacity:0},
      {transform:'scale(1.1)',opacity:1,offset:.3},
      {transform:'scale(1)',opacity:1,offset:.7},
      {transform:'scale(1)',opacity:0}
    ],{duration:2200,easing:'ease-out'});
    an.onfinish=()=>el.remove();
  } else setTimeout(()=>el.remove(),2200);
}
function shake(){
  const b=document.querySelector('.ov.show .ov-box');
  if(!b) return;
  b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
  setTimeout(()=>b.classList.remove('shake'),600);
}
function rareFx(r){
  if(r<=1){ sfx('coin'); return; }
  if(r===2){ sfx('win'); return; }
  if(r===3){ sfx('epic'); burst(24,RARS[3].c); return; }
  if(r===4){ sfx('legend'); flash('rgba(255,210,63,.45)'); burst(45,'#ffd23f'); banner('ЛЕГЕНДАРНЫЙ ДРОП!','#ffd23f'); shake(); return; }
  sfx('myth'); flash('rgba(255,59,92,.6)'); burst(70,'#ff3b5c'); burst(50,'#ff4fd8');
  banner('МИФИЧЕСКИЙ ДРОП!','#ff3b5c'); shake();
}

    ${rows}
    <div class="ov-btns"><button class="btn blk" data-act="close">Понятно</button></div>`);

function openCase(id){
  if(opening) return;
  const c=CASE_BY[id]; if(!c) return;
  if(S.coins<c.price){ toast('Недостаточно монет'); sfx('fail'); return; }
  opening=true;
  S.coins-=c.price; S.stats.opened++; save(); updCoins();
  const inst=makeInst(rollItem(c.id));
  const N=50, WIN=42;
  $('#open-title').textContent=c.name+' · 🪙 '+fmt(c.price);
  $('#open-res').innerHTML='';
  $('#open-btns').innerHTML='';
  showOv('#open-ov',true);
  const wrap=$('#strip-wrap'), strip=$('#strip');
  if(!wrap||!strip){ opening=false; S.coins+=c.price; S.stats.opened=Math.max(0,S.stats.opened-1); save(); updCoins(); toast('Не удалось запустить анимацию кейса'); return; }
  const W=wrap.clientWidth||300;
  const CW=Math.max(90,Math.min(130,Math.floor(W/3)));
  let html='';
  for(let i=0;i<N;i++){
    const it=ITEMS[i===WIN?inst.id:rollItem(c.id)];
    html+=`<div class="sc" style="width:${CW}px;--rc:${RARS[it.rar].c}"><span class="se">${it.emoji}</span><span class="sn">${esc(it.name)}</span></div>`;
  }
  strip.style.transform='translate3d(0,0,0)';
  strip.innerHTML=html;
  const target=WIN*CW+CW/2-W/2+(Math.random()-0.5)*CW*0.6;
  const D=4800, t0=performance.now();
  let last=-1;
  const step=now=>{
    const t=Math.min(1,(now-t0)/D);
    const x=target*(1-Math.pow(1-t,4));
    strip.style.transform='translate3d('+(-x).toFixed(1)+'px,0,0)';
    const idx=Math.floor((x+W/2)/CW);
    if(idx!==last){ last=idx; sfx('tick'); }
    if(t<1) requestAnimationFrame(step);
    else finishOpen(inst,c);
  };
  requestAnimationFrame(step);
}
function finishOpen(inst,c){
  opening=false;
  addItem(inst); save(); updCoins();
  const it=ITEMS[inst.id], v=valOf(inst);
  $('#open-res').innerHTML=resCard(inst);
  $('#open-btns').innerHTML=
    `<button class="btn blk" data-act="open" data-arg="${c.id}" ${S.coins<c.price?'disabled':''}>Открыть ещё · 🪙 ${fmt(c.price)}</button>`+
    `<button class="btn pk blk" data-act="sellOne" data-arg="${inst.uid}">Продать за 🪙 ${fmt(v)}</button>`+
    `<button class="btn ghost blk" data-act="keep">Оставить в инвентаре</button>`;
  rareFx(it.rar);
}

function renderInv(){
  const total=S.inv.reduce((a,i)=>a+valOf(i),0);
  const chips=['Все'].concat(RARS.map(r=>r.n)).map((n,i)=>`<button class="chip${invRar===i-1?' on':''}" data-act="invRar" data-arg="${i-1}">${n}</button>`).join('');
  let list=S.inv.filter(i=>invRar<0||ITEMS[i.id].rar===invRar);
  if(invSort==='val') list.sort((a,b)=>valOf(b)-valOf(a));
  else if(invSort==='low') list.sort((a,b)=>valOf(a)-valOf(b));
  else list.sort((a,b)=>(ITEMS[b.id].rar-ITEMS[a.id].rar)||(valOf(b)-valOf(a)));
  Array.from(selected).forEach(u=>{ if(!findInv(u)) selected.delete(u); });
  let bulk='';
  if(selected.size){
    let sum=0;
    selected.forEach(u=>{ const i=findInv(u); if(i) sum+=valOf(i); });
    bulk=`<div class="card bulk"><span>Выбрано: <b>${selected.size}</b> · 🪙 ${fmt(sum)}</span>
      <span class="rowr"><button class="btn sm pk" data-act="bulkSell">Продать</button><button class="btn sm ghost" data-act="bulkClear">Снять</button></span></div>`;
  }
  $('#inv-box').innerHTML=`<div class="card">
      <div class="kv"><span>Предметов</span><b>${S.inv.length}</b></div>
      <div class="kv"><span>Общая стоимость</span><b class="gold">🪙 ${fmt(total)}</b></div>
      <span class="lbl">Сортировка</span>
      <select class="inp" data-chg="invSort">
        <option value="val"${invSort==='val'?' selected':''}>Дороже сверху</option>
        <option value="low"${invSort==='low'?' selected':''}>Дешевле сверху</option>
        <option value="rar"${invSort==='rar'?' selected':''}>По редкости</option>
      </select>
      <div class="chips">${chips}</div>
    </div>
    ${bulk}
    <div class="grid">${list.length
      ?list.map(i=>itemCard(i,{detail:true,chk:true,sel:selected.has(i.uid)})).join('')
      :'<div class="muted center" style="grid-column:1/-1;padding:20px">Инвентарь пуст. Откройте кейс!</div>'}</div>`;
}
function bulkSell(){
  const list=Array.from(selected);
  let sum=0, n=0;
  list.forEach(u=>{ const v=sellInst(u); if(v){ sum+=v; n++; } });
  selected.clear();
  toast('Продано '+n+' предм. на 🪙 '+fmt(sum));
  renderInv();
}
function itemDetail(u){
  const i=findInv(u); if(!i) return;
  openModal(resCard(i)+`<div class="ov-btns">
    <button class="btn pk blk" data-act="sellOne" data-arg="${u}">Продать за 🪙 ${fmt(valOf(i))}</button>
    <button class="btn blk" data-act="toUp" data-arg="${u}">В апгрейдер</button>
    <button class="btn gd blk" data-act="listForm" data-arg="${u}">Выставить на рынок</button>
    <button class="btn ghost blk" data-act="close">Закрыть</button>
  </div>`);
}
function listForm(u){
  const i=findInv(u); if(!i) return;
  const v=valOf(i);
  openModal(`<div class="ov-title">На рынок: ${ITEMS[i.id].emoji} ${esc(ITEMS[i.id].name)}</div>
    <div class="muted center">Ценность 🪙 ${fmt(v)}. Покупатель найдётся, если цена не слишком высока.</div>
    <span class="lbl">Ваша цена, монеты</span>
    <input class="inp" id="lf-price" type="number" inputmode="numeric" min="1" value="${Math.round(v*1.1)}">
    <div class="ov-btns">
      <button class="btn gd blk" data-act="listOk" data-arg="${u}">Выставить</button>
      <button class="btn ghost blk" data-act="close">Отмена</button>
    </div>`);
}
function listItem(u,price){
  const i=S.inv.findIndex(x=>x.uid===u);
  if(i<0) return false;
  const p=Math.floor(Number(price));
  if(!(p>=1&&p<=1e9)){ toast('Введите корректную цену'); return false; }
  const inst=S.inv.splice(i,1)[0];
  S.mk.mine.push({lid:inst.uid,id:inst.id,w:inst.w,price:p,sellAt:Date.now()+(20+rnd(70))*1000});
  selected.delete(u);
  save(); sfx('click');
  toast('Лот выставлен на продажу');
  return true;
}

/* ===================== АПГРЕЙДЕР ===================== */
function renderUpgrade(){
  const box=$('#up-box');
  if(!S.inv.length){
    box.innerHTML=`<div class="card center"><div style="font-size:50px">🔧</div><p class="muted">Сначала получите предметы из кейсов.</p><button class="btn" data-act="go" data-arg="cases">К кейсам</button></div>`;
    return;
  }
  if(!findInv(upSel)) upSel=S.inv[0].uid;
  const opts=S.inv.map(i=>`<option value="${i.uid}"${i.uid===upSel?' selected':''}>${ITEMS[i.id].emoji} ${esc(ITEMS[i.id].name)} · ${WEARS[i.w].n} · 🪙${fmt(valOf(i))}</option>`).join('');
  box.innerHTML=`
    <div class="card">
      <span class="lbl">Предмет для улучшения</span>
      <select class="inp" data-chg="upItem">${opts}</select>
      <div class="kv"><span>Стоимость предмета</span><b id="up-base" class="gold"></b></div>
    </div>
    <div class="card">
      <div class="gauge" id="up-gauge"><div class="gauge-in"><b id="up-p"></b><span class="muted">шанс</span></div></div>
      <span class="lbl">Шанс успеха: <b id="up-pv"></b></span>
      <input type="range" id="upRange" min="3" max="90" step="1" value="${upChance}">
      <div class="chips" style="justify-content:center">${[10,25,50,75].map(p=>`<button class="chip" data-act="upPreset" data-arg="${p}">${p}%</button>`).join('')}</div>
      <div class="kv"><span>Множитель</span><b id="up-mult"></b></div>
      <div class="kv"><span>Цель (ценность приза)</span><b id="up-target" class="gold"></b></div>
      <div class="muted center" style="margin-top:8px">Чем меньше шанс, тем дороже возможный приз.</div>
    </div>
    <button class="btn pk blk" data-act="upDo">⚒️ УЛУЧШИТЬ</button>`;
  updUp();
}
function updUp(){
  const inst=findInv(upSel), g=$('#up-gauge');
  if(!inst||!g) return;
  const base=valOf(inst), p=upChance, mult=90/p, target=Math.round(base*mult);
  g.style.setProperty('--p',p);
  $('#up-p').textContent=p+'%';
  $('#up-pv').textContent=p+'%';
  $('#up-base').textContent='🪙 '+fmt(base);
  $('#up-mult').textContent='x'+mult.toFixed(2);
  $('#up-target').textContent='🪙 '+fmt(target);
  const sl=$('#upRange');
  if(sl && Number(sl.value)!==p) sl.value=p;
}
function makePrize(target){
  let c=COMBOS.filter(x=>x.v>=target).slice(0,6);
  if(!c.length) c=COMBOS.slice(-6);
  const x=c[rnd(c.length)];
  return {uid:uid(),id:x.id,w:x.w};
}
function doUpgrade(){
  if(upBusy) return;
  const inst=findInv(upSel);
  if(!inst){ toast('Выберите предмет для улучшения'); return; }
  const p=upChance, base=valOf(inst), target=Math.round(base*90/p);
  upBusy=true;
  S.inv=S.inv.filter(i=>i.uid!==inst.uid);
  S.stats.upgrades++;
  const win=Math.random()*100<p;
  let prize=null;
  if(win){ prize=makePrize(target); addItem(prize); S.stats.upWins++; }
  upSel=null;
  save(); updCoins();
  $('#up-title').textContent='Улучшение · шанс '+p+'%';
  $('#up-anim').innerHTML='<div class="upgrade-spin-wrap"><div class="upgrade-spin-wheel"><div class="usw-core">⚡</div></div><div class="upgrade-spin-caption">КОЛЕСО АПГРЕЙДА КРУТИТСЯ…</div></div>';
  $('#up-res').innerHTML='';
  $('#up-btns').innerHTML='';
  showOv('#up-ov',true);
  setTimeout(()=>{
    $('#up-anim').innerHTML='';
    if(win){
      $('#up-res').innerHTML='<div class="ov-title" style="color:#5ff5a0">УСПЕХ!</div>'+resCard(prize);
      $('#up-btns').innerHTML='<button class="btn gd blk" data-act="upClose">Отлично</button>';
      rareFx(ITEMS[prize.id].rar);
    } else {
      $('#up-res').innerHTML='<div class="res" style="--rc:#ff3b5c"><div class="res-em">💥</div><div class="res-name">Не повезло</div><div class="muted">Предмет потерян. Попробуйте меньший множитель.</div></div>';
      $('#up-btns').innerHTML='<button class="btn ghost blk" data-act="upClose">Понятно</button>';
      sfx('fail'); shake();
    }
    upBusy=false;
  },2600);
}

  const c=CASE_BY[battleCfg.caseId];
  const cost=c.price*battleCfg.rounds;
  $('#bt-box').innerHTML=`
    <div class="card">
      <span class="lbl">Выберите кейс</span>
      <div class="pgrid">${CASES.map(k=>`<button class="pick${k.id===c.id?' on':''}" style="--cc:${k.color}" data-act="btCase" data-arg="${k.id}"><span class="pe">${k.emoji}</span><span>${k.name}</span><small>🪙 ${fmt(k.price)}</small></button>`).join('')}</div>
    </div>
    <div class="card">
      <span class="lbl">Раундов</span>
      <div class="chips">${[2,3,5].map(n=>`<button class="chip${battleCfg.rounds===n?' on':''}" data-act="btRounds" data-arg="${n}">${n}</button>`).join('')}</div>
      <span class="lbl">Участников</span>
      <div class="chips">${[2,3,4].map(n=>`<button class="chip${battleCfg.players===n?' on':''}" data-act="btPlayers" data-arg="${n}">${n} чел.</button>`).join('')}</div>
      <div class="kv"><span>Ваш взнос</span><b class="gold">🪙 ${fmt(cost)}</b></div>
      <p class="muted">Побеждает тот, у кого выше суммарная стоимость выпавших предметов. Вы всегда получаете свои предметы, а при победе ещё и предметы соперников.</p>
      <button class="btn gd blk" data-act="btStart" ${(S.coins<cost||battling)?'disabled':''}>⚔️ НАЧАТЬ БАТЛ</button>
      <div class="muted center" style="margin-top:10px">Батлов: ${S.stats.battles} · побед: ${S.stats.battleWins}</div>
    </div>`;
}
function renderLanes(P,spin,win){
  const max=Math.max(1,...P.map(p=>p.total));
  $('#bt-lanes').innerHTML=P.map(p=>{
    const body=(spin||!p.last)?'<div class="ring rs"></div>':itemCard(p.last);
    return `<div class="lane${p.me?' me':''}">
      <div class="ln-name">${p.me?'⭐ ':''}${esc(p.name)}</div>
      <div class="ln-card">${body}</div>
      <div class="ln-total">🪙 ${fmt(p.total)}</div>
      <div class="bar"><i style="width:${(p.total/max*100).toFixed(1)}%"></i></div>
      ${win===p?'<div class="ln-win">👑 Победитель</div>':''}
    </div>`;
  }).join('');
}
async function startBattle(){
  if(battling) return;
  const c=CASE_BY[battleCfg.caseId]; if(!c) return;
  const cost=c.price*battleCfg.rounds;
  if(S.coins<cost){ toast('Недостаточно монет для батла'); sfx('fail'); return; }
  battling=true;
  S.coins-=cost; save(); updCoins();
  const pool=BOTS.slice().sort(()=>Math.random()-0.5);
  const P=[{name:'Вы',me:true,total:0,items:[],last:null}];
  for(let i=0;i<battleCfg.players-1;i++) P.push({name:pool[i],me:false,total:0,items:[],last:null});
  $('#bt-title').textContent='⚔️ '+c.name;
  $('#bt-round').textContent='Подготовка...';
  $('#bt-res').innerHTML='';
  $('#bt-btns').innerHTML='';
  showOv('#bt-ov',true);
  renderLanes(P,false,null);
  await sleep(500);
  for(let r=1;r<=battleCfg.rounds;r++){
    $('#bt-round').textContent='Раунд '+r+' из '+battleCfg.rounds;
    renderLanes(P,true,null);
    sfx('tick');
    await sleep(800);
    P.forEach(p=>{
      const inst=makeInst(rollItem(c.id));
      p.items.push(inst); p.total+=valOf(inst); p.last=inst;
    });
    renderLanes(P,false,null);
    sfx('click');
    await sleep(900);
  }
  const best=Math.max(...P.map(p=>p.total));
  const tops=P.filter(p=>p.total===best);
  const win=tops[rnd(tops.length)];
  const won=win.me;
  S.stats.battles++;
  if(won) S.stats.battleWins++;
  let gained=0, cnt=0;
  P.forEach(p=>{
    if(p.me||won){
      p.items.forEach(i=>{ addItem(i); gained+=valOf(i); cnt++; });
    }
  });
  save(); updCoins();
  renderLanes(P,false,win);
  $('#bt-round').textContent='Итоги батла';
  const col=won?'#ffd23f':'#ff3b5c';
  $('#bt-res').innerHTML=`<div class="res" style="--rc:${col}">
    <div class="res-rar" style="color:${col}">${won?'Победа!':'Поражение'}</div>
    <div class="res-name">Победитель: ${esc(win.name)}</div>
    <div class="res-val" style="font-size:15px">Вы получили ${cnt} предм. на 🪙 ${fmt(gained)}</div></div>`;
  $('#bt-btns').innerHTML=`<button class="btn gd blk" data-act="btAgain">Ещё батл</button><button class="btn ghost blk" data-act="btClose">Закрыть</button>`;
  if(won){ sfx('win'); burst(30,'#ffd23f'); } else sfx('fail');
  battling=false;
}

/* ===================== ТОРГОВАЯ ПЛОЩАДКА ===================== */
function makeBotLot(){
  const c=CASES[rnd(CASES.length)];
  const inst=makeInst(rollItem(c.id));
  const v=valOf(inst);
  return {lid:uid(),id:inst.id,w:inst.w,price:Math.max(1,Math.round(v*(0.85+Math.random()*0.7))),seller:BOTS[rnd(BOTS.length)]};
}
function ensureBots(){
  while(S.mk.bots.length<12) S.mk.bots.push(makeBotLot());
}
function renderMarket(){
  ensureBots();
  let bots=S.mk.bots.filter(b=>mktRar<0||ITEMS[b.id].rar===mktRar);
  if(mktSort==='cheap') bots.sort((a,b)=>a.price-b.price);
  else if(mktSort==='exp') bots.sort((a,b)=>b.price-a.price);
  else bots.sort((a,b)=>(a.price/valOf(a))-(b.price/valOf(b)));
  const chips=['Все'].concat(RARS.map(r=>r.n)).map((n,i)=>`<button class="chip${mktRar===i-1?' on':''}" data-act="mkRar" data-arg="${i-1}">${n}</button>`).join('');
  const cards=bots.map(b=>{
    const v=valOf(b), d=Math.round((b.price/v-1)*100);
    return `<div class="mcard">${itemCard({uid:b.lid,id:b.id,w:b.w})}
      <div class="kv"><b class="gold">🪙 ${fmt(b.price)}</b><span class="${d<=0?'good':'bad'}">${d>0?'+':''}${d}%</span></div>
      <div class="muted small">Продавец: ${esc(b.seller)}</div>
      <button class="btn sm blk" data-act="buy" data-arg="${b.lid}" ${S.coins<b.price?'disabled':''}>Купить</button>
    </div>`;
  }).join('');
  const mine=S.mk.mine.map(l=>{
    const it=ITEMS[l.id];
    return `<div class="kv"><span>${it.emoji} ${esc(it.name)}<br><small class="muted">Ценность 🪙 ${fmt(valOf(l))}</small></span>
      <span class="rowr"><b class="gold">🪙 ${fmt(l.price)}</b><button class="btn sm ghost" data-act="cancelLot" data-arg="${l.lid}">Снять</button></span></div>`;
  }).join('');
  const opts=S.inv.map(i=>`<option value="${i.uid}">${ITEMS[i.id].emoji} ${esc(ITEMS[i.id].name)} · 🪙${fmt(valOf(i))}</option>`).join('');
  const firstV=S.inv.length?valOf(S.inv[0]):0;
  $('#mk-box').innerHTML=`
    <div class="card">
      <span class="lbl">Редкость</span>
      <div class="chips">${chips}</div>
      <span class="lbl">Сортировка</span>
      <select class="inp" data-chg="mkSort">
        <option value="cheap"${mktSort==='cheap'?' selected':''}>Сначала дешевле</option>
        <option value="exp"${mktSort==='exp'?' selected':''}>Сначала дороже</option>
        <option value="deal"${mktSort==='deal'?' selected':''}>Самые выгодные</option>
      </select>
    </div>
    <div class="grid">${cards||'<div class="muted center" style="grid-column:1/-1;padding:16px">Нет лотов по этому фильтру</div>'}</div>
    <div class="card" style="margin-top:12px"><h3 class="sub">📦 Ваши лоты</h3>${mine||'<div class="muted">Пока пусто.</div>'}</div>
    <div class="card"><h3 class="sub">➕ Выставить предмет</h3>
      ${S.inv.length
        ?`<span class="lbl">Предмет</span>
          <select class="inp" id="mk-sel" data-chg="mkSel">${opts}</select>
          <span class="lbl">Цена, монеты</span>
          <input class="inp" id="mk-price" type="number" inputmode="numeric" min="1" value="${Math.round(firstV*1.1)}">
          <button class="btn pk blk" data-act="mkList">Выставить на продажу</button>`
        :'<div class="muted">Нет предметов для продажи. Откройте кейс!</div>'}
    </div>`;
}
function buyLot(lid){
  const i=S.mk.bots.findIndex(b=>b.lid===lid);
  if(i<0) return;
  const b=S.mk.bots[i];
  if(S.coins<b.price){ toast('Недостаточно монет'); sfx('fail'); return; }
  S.coins-=b.price;
  S.stats.bought++;
  S.mk.bots.splice(i,1);
  addItem({uid:uid(),id:b.id,w:b.w});
  S.mk.bots.push(makeBotLot());
  save(); updCoins(); sfx('coin');
  toast('Куплено: '+ITEMS[b.id].name);
  renderMarket();
}
function cancelLot(lid){
  const i=S.mk.mine.findIndex(l=>l.lid===lid);
  if(i<0) return;
  const l=S.mk.mine.splice(i,1)[0];
  S.inv.push({uid:l.lid,id:l.id,w:l.w});
  save();
  toast('Лот снят, предмет возвращён');
  renderMarket();
}
function mkList(){
  const s=$('#mk-sel'), p=$('#mk-price');
  if(!s||!p){ toast('Нет предметов для продажи'); return; }
  if(listItem(s.value,p.value)) renderMarket();
}
function processSales(){
  const now=Date.now();
  let sold=[], changed=false;
  S.mk.mine=S.mk.mine.filter(l=>{
    if(now<l.sellAt) return true;
    changed=true;
    const r=l.price/valOf(l);
    const ch=Math.max(0,Math.min(0.9,(1.3-r)/0.3*0.9));
    if(Math.random()<ch){
      S.coins+=l.price; S.stats.sold++;
      sold.push(l);
      return false;
    }
    l.sellAt=now+(30+rnd(60))*1000;
    return true;
  });
  if(changed){ save(); updCoins(); }
  sold.forEach(l=>toast('Продано: '+ITEMS[l.id].name+' за 🪙 '+fmt(l.price)));
  if(sold.length && currentPage==='market') renderMarket();
}

/* ===================== БОНУСЫ ===================== */
function renderBonus(){
  const today=new Date().toDateString();
  const yest=new Date(Date.now()-DAY).toDateString();
  const got=S.daily.last===today;
  const done=got?S.daily.streak:(S.daily.last===yest?S.daily.streak%7:0);
  const days=DAILY.map((r,i)=>`<div class="day${i<done?' on':''}"><b>${i+1}</b>🪙${r}</div>`).join('');
  const freeReady=Date.now()>=S.wheelAt;
  const tasks=TASKS.map(t=>{
    const pr=Math.min(S.stats[t.k]||0,t.n);
    const doneT=pr>=t.n;
    const cl=!!S.claimed[t.id];
    const btn=cl
      ?'<button class="btn sm ghost" disabled>Получено</button>'
      :`<button class="btn sm${doneT?' gd':' ghost'}" data-act="task" data-arg="${t.id}" ${doneT?'':'disabled'}>${doneT?'Забрать':'В процессе'}</button>`;
    return `<div class="task"><div>
        <div class="tt">${t.t}</div>
        <div class="bar"><i style="width:${(pr/t.n*100).toFixed(0)}%"></i></div>
        <div class="tp">${pr}/${t.n} · награда 🪙 ${t.r}</div>
      </div>${btn}</div>`;
  }).join('');
  $('#bn-box').innerHTML=`
    <div class="card">
      <h3 class="sub">🎁 Ежедневный бонус</h3>
      <div class="days">${days}</div>
      <button class="btn gd blk" data-act="daily" ${got?'disabled':''}>${got?'Бонус получен, приходите завтра':'Забрать бонус'}</button>
    </div>
    <div class="card center">
      <h3 class="sub">🎡 Колесо удачи</h3>
      <div class="wheel-box"><div class="wptr"></div><canvas id="wheel" width="520" height="520" style="transform:rotate(${wheelRot}deg)"></canvas></div>
      <div class="muted" id="bn-cd"></div>
      <div class="rowr" style="justify-content:center;margin-top:8px">
        <button class="btn" id="spin-free" data-act="spin" ${(spinning||!freeReady)?'disabled':''}>Бесплатно</button>
        <button class="btn pk" data-act="spinPaid" ${spinning?'disabled':''}>Крутить за 🪙 ${WHEEL_COST}</button>
      </div>
    </div>
    <div class="card"><h3 class="sub">📋 Задания</h3>${tasks}</div>
    <div class="center" style="margin:6px 0 10px"><button class="btn sm ghost" data-act="reset">Сбросить прогресс</button></div>`;
  drawWheel();
  updTimers();
}
function updTimers(){
  const cd=$('#bn-cd'), fb=$('#spin-free');
  const ms=S.wheelAt-Date.now();
  if(cd) cd.textContent=ms>0?'Бесплатное вращение через '+fmtTime(ms):'Бесплатное вращение готово';
  if(fb) fb.disabled=spinning||ms>0;
}
function drawWheel(){
  const cv=$('#wheel');
  if(!cv||!cv.getContext) return;
  const ctx=cv.getContext('2d');
  const R=cv.width/2, n=WHEEL.length, s=2*Math.PI/n;
  ctx.clearRect(0,0,cv.width,cv.height);
  WHEEL.forEach((w,i)=>{
    const a0=i*s-Math.PI/2, a1=a0+s;
    ctx.beginPath(); ctx.moveTo(R,R); ctx.arc(R,R,R-6,a0,a1); ctx.closePath();
    ctx.fillStyle=w.c; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=3; ctx.stroke();
    ctx.save();
    ctx.translate(R,R); ctx.rotate(a0+s/2);
    ctx.textAlign='right'; ctx.fillStyle='#fff'; ctx.font='bold 26px sans-serif';
    ctx.fillText(w.l,R-30,9);
    ctx.restore();
  });
  ctx.beginPath(); ctx.arc(R,R,38,0,2*Math.PI); ctx.fillStyle='#0b0618'; ctx.fill();
  ctx.strokeStyle='#ffd23f'; ctx.lineWidth=5; ctx.stroke();
}
function spinWheel(paid){
  if(spinning) return;
  if(paid){
    if(S.coins<WHEEL_COST){ toast('Нужно '+WHEEL_COST+' монет'); sfx('fail'); return; }
    S.coins-=WHEEL_COST;
  } else {
    if(Date.now()<S.wheelAt){ toast('Бесплатное вращение ещё не готово'); return; }
    S.wheelAt=Date.now()+WHEEL_CD;
  }
  const idx=pickW(WHEEL.map(w=>w.w));
  const s=360/WHEEL.length;
  const base=(Math.floor(wheelRot/360)+5)*360;
  wheelRot=base+((((-(idx+0.5)*s)%360)+360)%360);
  spinning=true;
  save(); updCoins(); sfx('tick');
  const el=$('#wheel');
  if(el) el.style.transform='rotate('+wheelRot+'deg)';
  updTimers();
  setTimeout(()=>{
    spinning=false;
    S.stats.spins++;
    applyWheel(WHEEL[idx]);
    save(); updCoins();
    if(currentPage==='bonus') renderBonus();
  },5200);
}
function applyWheel(w){
  if(w.t==='c'){
    S.coins+=w.v;
    toast('Выигрыш: 🪙 '+w.v);
    sfx('coin');
  } else if(w.t==='i'){
    const c=CASES[rnd(CASES.length)];
    const id=c.id+rollRar(w.min||0);
    addItem(makeInst(id));
    toast('Приз: '+ITEMS[id].name);
    rareFx(ITEMS[id].rar);
  } else {
    toast('Пусто! Повезёт в следующий раз');
    sfx('fail');
  }
}
function claimDaily(){
  const today=new Date().toDateString();
  if(S.daily.last===today){ toast('Бонус уже получен сегодня'); return; }
  const yest=new Date(Date.now()-DAY).toDateString();
  const day=S.daily.last===yest?(S.daily.streak%7)+1:1;
  const r=DAILY[day-1];
  S.coins+=r;
  S.daily={last:today,streak:day};
  save(); updCoins(); sfx('coin'); burst(20,'#ffd23f');
  toast('+🪙 '+r+' · день '+day);
  renderBonus();
}
function claimTask(id){
  const t=TASKS.find(x=>x.id===id);
  if(!t||S.claimed[id]) return;
  if((S.stats[t.k]||0)<t.n){ toast('Задание ещё не выполнено'); return; }
  S.claimed[id]=true;
  S.coins+=t.r;
  save(); updCoins(); sfx('coin');
  toast('Задание выполнено: +🪙 '+t.r);
  renderBonus();
}

/* ===================== ЛОКАЛЬНАЯ АВТОРИЗАЦИЯ ===================== */
function readAuthUsers(){
  try{ return JSON.parse(localStorage.getItem(AUTH_USERS_KEY)||'{}')||{}; }
  catch(e){ return {}; }
}
function bytesToHex(bytes){ return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function hexToBytes(hex){
  const out=new Uint8Array(hex.length/2);
  for(let i=0;i<out.length;i++) out[i]=parseInt(hex.slice(i*2,i*2+2),16);
  return out;
}
async function passwordHash(password,saltHex){
  if(!window.crypto||!window.crypto.subtle) throw new Error('Secure crypto недоступна. Откройте сайт через HTTPS в Safari.');
  const key=await window.crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
  const bits=await window.crypto.subtle.deriveBits({name:'PBKDF2',salt:hexToBytes(saltHex),iterations:120000,hash:'SHA-256'},key,256);
  return bytesToHex(new Uint8Array(bits));
}
function showAuth(mode,message){
  authMode=mode;
  document.body.classList.add('auth-locked');
  const screen=$('#auth-screen');
  screen.classList.remove('hidden');
  const registering=mode==='register';
  screen.innerHTML=`<div class="auth-card">
    <div class="auth-logo">NEON CASE ARENA</div>

    <form id="auth-form">

      <input class="inp" id="auth-name" name="username" type="text" minlength="3" maxlength="24" autocomplete="username" placeholder="Придумай логин" required>
      <label class="lbl" for="auth-pass">Пароль</label>
      <input class="inp" id="auth-pass" name="password" type="password" minlength="8" autocomplete="${registering?'new-password':'current-password'}" placeholder="Минимум 8 символов" required>
      ${registering?'<label class="lbl" for="auth-pass2">Повтори пароль</label><input class="inp" id="auth-pass2" type="password" minlength="8" autocomplete="new-password" placeholder="Повтори пароль" required>':''}

    </form>

    <div class="auth-note">Аккаунт хранится только в этом браузере на этом устройстве. Не используй пароль от почты или других важных аккаунтов. Игровые монеты — виртуальные, без денежных пополнений и выплат.</div>
  </div>`;
}
function activateAccount(username,migrateLegacy){
  AUTH_USER=username;
  KEY=USER_STATE_PREFIX+encodeURIComponent(username.toLowerCase());
  if(migrateLegacy && !localStorage.getItem(KEY)){
    const old=localStorage.getItem(LEGACY_KEY);
    if(old) localStorage.setItem(KEY,old);
  }
  S=loadState();
  selected.clear(); upSel=null; opening=false; upBusy=false; battling=false; spinning=false;
  localStorage.setItem(AUTH_SESSION_KEY,username);
  $('#auth-screen').classList.add('hidden');
  document.body.classList.remove('auth-locked');
  updCoins(); updSnd(); go('cases'); processSales();
}
async function submitAuth(mode){
  const nameEl=$('#auth-name'), passEl=$('#auth-pass'), msg=$('#auth-msg'), btn=$('#auth-submit');
  if(!nameEl||!passEl) return;
  const username=nameEl.value.trim();
  const normalized=username.toLowerCase();
  const password=passEl.value;
  const users=readAuthUsers();
  if(!/^[a-zA-Z0-9_а-яА-Я-]{3,24}$/.test(username)){ msg.textContent='Логин: 3–24 символа, буквы, цифры, _ или -.'; return; }
  if(password.length<8){ msg.textContent='Пароль должен содержать минимум 8 символов.'; return; }
  if(mode==='register'){
    const pass2=$('#auth-pass2');
    if(!pass2||password!==pass2.value){ msg.textContent='Пароли не совпадают.'; return; }
    if(users[normalized]){ msg.textContent='Такой логин уже занят на этом устройстве.'; return; }
  } else if(!users[normalized]){ msg.textContent='Аккаунт не найден на этом устройстве. Сначала зарегистрируйся.'; return; }
  btn.disabled=true; btn.textContent='Проверка…'; msg.textContent='';
  try{
    if(mode==='register'){
      const salt=bytesToHex(window.crypto.getRandomValues(new Uint8Array(16)));
      const hash=await passwordHash(password,salt);
      const firstAccount=Object.keys(users).length===0;
      users[normalized]={username,salt,hash,createdAt:Date.now()};
      localStorage.setItem(AUTH_USERS_KEY,JSON.stringify(users));
      activateAccount(username,firstAccount);
      toast('Аккаунт создан. Добро пожаловать!');
    } else {
      const account=users[normalized];
      const hash=await passwordHash(password,account.salt);
      if(hash!==account.hash){ msg.textContent='Неверный пароль.'; btn.disabled=false; btn.textContent='Войти'; return; }
      activateAccount(account.username||username,false);
      toast('Вход выполнен!');
    }
  }catch(e){
    msg.textContent=e&&e.message?e.message:'Не удалось выполнить вход. Проверьте настройки браузера.';
    btn.disabled=false; btn.textContent=mode==='register'?'Создать аккаунт':'Войти';
  }
}
function initAuth(){
  const users=readAuthUsers();
  let session='';
  try{ session=localStorage.getItem(AUTH_SESSION_KEY)||''; }catch(e){}
  if(session&&users[session.toLowerCase()]) activateAccount(users[session.toLowerCase()].username||session,false);
  else showAuth('login');
}
function logout(){
  try{ localStorage.removeItem(AUTH_SESSION_KEY); }catch(e){}
  AUTH_USER=null; KEY=LEGACY_KEY; S=defState(); selected.clear();

}
