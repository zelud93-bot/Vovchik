<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>NEON CASE ARENA</title>
<style>
:root {
  --bg: #080b12;
  --panel: rgba(17, 22, 35, .88);
  --panel-2: rgba(22, 28, 44, .92);
  --line: rgba(151, 174, 219, .13);
  --muted: #8d99b2;
  --text: #f4f6ff;
  --cyan: #52e8ff;
  --violet: #a96bff;
  --pink: #ff4eaa;
  --green: #60e8a6;
  --gold: #ffc76a;
  --radius: 18px;
  --shadow: 0 18px 55px rgba(0, 0, 0, .28);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  min-width: 320px;
  overflow-x: hidden;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  overflow-x: hidden;
  color: var(--text);
  background:
    radial-gradient(ellipse at 12% -10%, rgba(109, 65, 210, .24), transparent 36%),
    radial-gradient(ellipse at 100% 24%, rgba(0, 191, 255, .12), transparent 32%),
    radial-gradient(ellipse at 48% 100%, rgba(255, 63, 158, .07), transparent 38%),
    var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  line-height: 1.45;
}

body::before {
  position: fixed;
  z-index: -1;
  inset: 0;
  pointer-events: none;
  content: "";
  opacity: .24;
  background-image:
    linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
  background-size: 42px 42px;
}

body.modal-open {
  overflow: hidden;
}

button, input, select {
  font: inherit;
}

button {
  color: inherit;
}

button:focus-visible,
select:focus-visible,
input:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}

button:disabled {
  cursor: not-allowed !important;
  opacity: .45;
  filter: saturate(.55);
  transform: none !important;
}

[hidden] {
  display: none !important;
}

.container {
  width: min(1180px, calc(100% - 32px));
  margin-inline: auto;
}

.topbar {
  position: relative;
  z-index: 2;
  border-bottom: 1px solid rgba(255,255,255,.06);
  background: rgba(7, 10, 17, .72);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.topbar-inner {
  min-height: 74px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  color: var(--text);
  text-decoration: none;
  cursor: pointer;
}

.brand-mark {
  position: relative;
  width: 44px;
  height: 44px;
  flex: 0 0 44px;
  display: grid;
  place-items: center;
  overflow: hidden;
  border: 1px solid rgba(82, 232, 255, .45);
  border-radius: 14px;
  color: #fff;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: -.08em;
  background: linear-gradient(135deg, rgba(82,232,255,.25), rgba(169,107,255,.2) 55%, rgba(255,78,170,.23));
  box-shadow: 0 0 24px rgba(82, 232, 255, .15), inset 0 0 18px rgba(255,255,255,.06);
}

.brand-mark::after {
  position: absolute;
  width: 27px;
  height: 27px;
  content: "";
  border: 1px solid rgba(255,255,255,.37);
  transform: rotate(45deg);
}

.brand-name {
  display: block;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: .12em;
  line-height: 1.1;
}

.brand-subtitle {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .19em;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 9px;
}

.wallet-chip,
.sound-button {
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: rgba(255,255,255,.045);
}

.wallet-chip {
  color: var(--gold);
  font-size: 14px;
  font-weight: 800;
}

.wallet-coin {
  width: 20px;
  height: 20px;
  display: inline-grid;
  place-items: center;
  border: 1px solid rgba(255,199,106,.65);
  border-radius: 50%;
  color: #ffe4a8;
  font-size: 11px;
  background: radial-gradient(circle at 35% 30%, #fff1ba, #ffae3d 60%, #a95b12);
  box-shadow: 0 0 12px rgba(255, 173, 61, .25);
}

.sound-button {
  width: 44px;
  padding: 0;
  color: #dbe3f7;
  font-size: 17px;
  cursor: pointer;
  transition: .2s ease;
}

.sound-button:hover {
  border-color: rgba(82,232,255,.5);
  color: var(--cyan);
}

.hero {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 270px;
  gap: 20px;
  margin-top: 22px;
  padding: 30px 34px;
  overflow: hidden;
  border: 1px solid rgba(133, 146, 207, .2);
  border-radius: 25px;
  background:
    radial-gradient(ellipse at 80% 20%, rgba(98, 67, 198, .19), transparent 38%),
    linear-gradient(115deg, rgba(21, 28, 45, .94), rgba(13, 17, 29, .92));
  box-shadow: var(--shadow);
}

.hero::before {
  position: absolute;
  width: 430px;
  height: 430px;
  top: -260px;
  left: 28%;
  content: "";
  border-radius: 50%;
  background: rgba(82,232,255,.06);
  filter: blur(24px);
  pointer-events: none;
}

.hero-copy,
.hero-side {
  position: relative;
  z-index: 1;
  min-width: 0;
}

.eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 9px;
  color: var(--cyan);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .18em;
  text-transform: uppercase;
}

.live-dot {
  width: 7px;
  height: 7px;
  display: inline-block;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 12px var(--green);
  animation: livePulse 1.8s ease-in-out infinite;
}

.hero h1 {
  max-width: 700px;
  margin: 15px 0 8px;
  font-size: clamp(30px, 5vw, 54px);
  line-height: 1.02;
  letter-spacing: -.055em;
}

.hero h1 em {
  color: transparent;
  font-style: normal;
  background: linear-gradient(90deg, var(--cyan), #a9a5ff 55%, var(--pink));
  -webkit-background-clip: text;
  background-clip: text;
}

.hero-copy > p {
  max-width: 580px;
  margin: 0;
  color: #a6b0c5;
  font-size: 14px;
}

.hero-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 22px;
}

.hero-level {
  width: min(410px, 100%);
  margin-top: 22px;
  padding: 12px 14px;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 14px;
  background: rgba(5, 9, 16, .38);
}

.hero-level-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
  color: #cbd4e8;
  font-size: 11px;
  font-weight: 800;
}

.hero-level-top span:first-child {
  color: var(--cyan);
  letter-spacing: .09em;
}

.progress-track {
  height: 7px;
  overflow: hidden;
  border-radius: 99px;
  background: rgba(255,255,255,.08);
}

.progress-track > i {
  width: 0;
  height: 100%;
  display: block;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
  box-shadow: 0 0 14px rgba(82,232,255,.48);
  transition: width .35s ease;
}

.hero-side {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.hero-hologram {
  position: relative;
  width: 190px;
  height: 160px;
  display: grid;
  place-items: center;
}

.holo-ring {
  position: absolute;
  width: 138px;
  height: 138px;
  border: 1px solid rgba(82,232,255,.44);
  border-radius: 50%;
  box-shadow: 0 0 32px rgba(82,232,255,.14), inset 0 0 22px rgba(82,232,255,.08);
  animation: slowSpin 18s linear infinite;
}

.holo-ring::before,
.holo-ring::after {
  position: absolute;
  inset: 13px;
  content: "";
  border: 1px dashed rgba(169,107,255,.46);
  border-radius: 50%;
}

.holo-ring::after {
  inset: 25px;
  border-style: solid;
  border-color: rgba(255,78,170,.34);
}

.holo-crate {
  position: relative;
  z-index: 1;
  width: 92px;
  height: 82px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(82,232,255,.75);
  border-radius: 17px;
  color: #e9fdff;
  font-size: 42px;
  background: linear-gradient(145deg, rgba(82,232,255,.2), rgba(116,78,220,.26) 60%, rgba(255,78,170,.15));
  box-shadow: 0 0 32px rgba(82,232,255,.26), inset 0 0 20px rgba(255,255,255,.09);
  transform: rotate(-7deg);
}

.holo-crate::after {
  position: absolute;
  inset: 9px;
  content: "";
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 10px;
}

.hero-note {
  max-width: 220px;
  color: #8996ad;
  font-size: 10px;
  text-align: center;
}

.hero-note strong {
  color: #cbd6ed;
